name: daemon-x86

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Instalar dependencias x86
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgtest-dev libsqlite3-dev
      - name: Configurar CMake
        working-directory: daemon
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Compilar
        working-directory: daemon
        run: cmake --build build --parallel 2
      - name: Pruebas con CTest
        working-directory: daemon/build
        run: ctest --output-on-failure
      - name: Pruebas Unity del protocolo (common/protocolo)
        run: |
          cmake -S common/protocolo -B build-proto
          cmake --build build-proto
          ctest --test-dir build-proto --output-on-failure
