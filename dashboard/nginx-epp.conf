# /etc/nginx/sites-available/epp — dashboard del verificador de EPP
# Sirve la pagina en el puerto 80 de la red local y reenvia /api/ al daemon, que solo escucha
# en 127.0.0.1:8081 (el daemon nunca queda expuesto directamente a la red).
# La API es de SOLO LECTURA: no hay forma de autorizar el paso ni cambiar la configuracion desde aqui.
server {
    listen 80 default_server;
    server_name _;
    root /opt/epp/dashboard;
    index index.html;

    location / { try_files $uri $uri/ =404; }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Metricas de nginx para la instrumentacion (solo desde la propia Jetson)
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
