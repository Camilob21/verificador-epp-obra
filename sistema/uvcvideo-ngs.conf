# /etc/modprobe.d/uvcvideo-ngs.conf — quirk del driver uvcvideo para la webcam NGS XPRESSCAM300 (1903:8b28)
#
# Sintoma (kernel 4.9 de la Jetson): el daemon falla al abrir la camara con
#   "VIDIOC_S_FMT: Input/output error"
# y dmesg muestra
#   "uvcvideo: Failed to set UVC probe control : -75 (exp. 26)."
# La camara se declara UVC 1.0 (mensaje de negociacion de 26 bytes) pero responde con el formato
# largo de UVC 1.1 (34 bytes): -75 = EOVERFLOW. Reconectar el cable a veces lo "arreglaba", por
# eso al principio se confundio con el ahorro de energia USB (hipotesis descartada el 24-nov).
#
# quirks=0x04 (UVC_QUIRK_PROBE_EXTRAFIELDS) hace que uvcvideo use el mensaje largo.
# Verificado el 24-nov: dos aperturas seguidas sin reconectar, y apertura correcta tras reiniciar
# (cat /sys/module/uvcvideo/parameters/quirks -> 4; dmesg sin "probe control").
# Afecta a todas las camaras UVC de la Jetson, que en este sistema es solo una.
options uvcvideo quirks=0x04
